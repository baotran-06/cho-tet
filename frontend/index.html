<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bến Mai · Chợ Tết Online</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/market.css"></head>
<body class="game-page market-page"><main id="game">
<canvas id="world" aria-label="Chợ Tết Việt Nam 3D"></canvas>
<header class="market-header">
  <div class="market-brand"><span class="market-seal" aria-hidden="true">✿</span><div><h1>Bến Mai</h1><span id="mode-label">Đang mở chợ…</span></div></div>
  <div class="market-growth"><strong id="market-level">Chợ mới mở</strong><span id="market-total">0 món đã giao</span><progress id="market-progress" max="10" value="0" aria-label="Tiến độ phát triển khu chợ"></progress><small id="market-queue"></small></div>
</header>
<div class="market-notices"><p id="connection-label"></p><ul id="market-feed" aria-label="Đơn hàng đã giao"></ul></div>
<div class="market-footer">
  <section class="gift-board"><h2>Quà tặng trong chợ</h2><div id="market-gifts" class="market-gifts"></div></section>
  <div class="market-actions"><button id="welcome-demo" hidden>Thử đơn DEMO</button><button id="game-music-toggle" type="button" aria-expanded="false" aria-controls="game-music">♫ Nhạc</button><button id="fullscreen" aria-label="Toàn màn hình">⛶</button><a href="admin.html" target="_blank" rel="noopener">Điều khiển ↗</a></div>
</div>
<section id="game-music" class="game-music" aria-label="Nhạc nền" hidden>
  <label for="game-music-files">Thêm nhạc từ máy</label>
  <input id="game-music-files" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" multiple>
  <select id="game-music-list" aria-label="Chọn bài nhạc" disabled></select>
  <audio id="game-music-audio" aria-label="Trình phát nhạc nền" controls preload="metadata" hidden></audio>
  <small id="game-music-status" role="status">Chọn file MP3 hoặc WAV rồi bấm phát.</small>
</section>
<p id="shipment" class="shipment" hidden></p><div id="toast" class="market-toast" role="status" hidden></div><div id="fatal" class="fatal" hidden></div>
</main><script type="module" src="js/market-game.js"></script><script type="module" src="js/market-music.js"></script></body></html>
