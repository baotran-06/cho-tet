<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tổng tài · Mẫu 3D thật</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f4e8d5;font:16px Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:22px;left:24px;pointer-events:none}h1{font-size:clamp(22px,4vw,38px);margin:8px 0}p{color:#b8bec8;max-width:380px;line-height:1.6;margin:4px 0}.tag{color:#ddb873;font-size:12px;letter-spacing:2px}.panel{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;background:#131c28e8;border:1px solid #ffffff24;padding:12px;border-radius:16px;backdrop-filter:blur(12px);text-align:center}button{background:#263447;color:#eee;border:1px solid #576070;padding:12px 16px;border-radius:9px;font:inherit;cursor:pointer;margin:3px}button[aria-pressed=true]{background:#dcb878;color:#161a21;border-color:#dcb878}small{display:block;color:#b8bec8;font-size:13px;padding:5px}#error{position:absolute;top:40%;left:8%;right:8%;color:#fff;background:#721b26;padding:20px;display:none}@media(max-width:600px){header{top:16px;left:16px}p{font-size:14px;max-width:290px}button{font-size:14px;padding:10px}.panel{bottom:12px}}
</style><header><span class="tag">BẢN DỰNG THỬ · WEBGL</span><h1>TỔNG TÀI</h1><p>Model hình học 3D thật. Kéo để xoay góc nhìn, cuộn để xem gần hơn.</p></header><canvas id="view"></canvas><div id="error"></div><div class="panel"><div><button data-action="idle" aria-pressed="true">Đứng</button><button data-action="sit" aria-pressed="false">Ngồi</button><button data-action="stand" aria-pressed="false">Đứng dậy</button><button data-action="walk" aria-pressed="false">Đi lại</button></div><small id="status">Đứng · thở nhẹ và nhìn quanh</small><button id="turn">Xoay 360°</button><button id="reset">Góc chính diện</button></div><script type="module" src="model.js"></script></html>
