musicUnlock.onclick=()=>{unlock();playMusic()};music.onplaying=()=>{musicState='Đang phát nhạc';musicUnlock.style.display='none'};music.onerror=()=>{if(musicUrl)musicState='Lỗi định dạng nhạc: '+(music.error?.code||'?')};
function setTrack(file){music.pause();if(musicUrl)URL.revokeObjectURL(musicUrl);musicUrl=file?URL.createObjectURL(file):'';musicName=file?.name||'';if(musicUrl){music.src=musicUrl;music.load();musicState='Đã nhận nhạc';playMusic()}else{music.removeAttribute('src');music.load();musicState='Chưa có nhạc';musicUnlock.style.display='none'}}
async function loadMedia(){const gen=++mediaGeneration;try{let db=await new Promise((ok,no)=>{let q=indexedDB.open('traffic-media',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});let read=k=>new Promise(ok=>{let q=db.transaction('files').objectStore('files').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)});let m=await read('music');let files=await Promise.all(['motor','slap','kick','brake','horn','swish','rescue'].map(async k=>[k,await read(k)]));db.close();if(gen!==mediaGeneration)return;if(!musicUrl||!m||m.name!==musicName)setTrack(m);else playMusic();for(let url of customSounds.values())URL.revokeObjectURL(url);customSounds.clear();for(let [k,b] of files)if(b)customSounds.set(k,URL.createObjectURL(b));}catch(e){musicState='Lỗi đọc nhạc: '+(e?.message||e)}}
loadMedia();document.addEventListener('pointerdown',()=>playMusic());
function settings(d){musicEnabled=!!d.musicEnabled;music.volume=Math.max(0,Math.min(1,Number(d.musicVolume??.25)));if(musicEnabled)playMusic();else{music.pause();musicUnlock.style.display='none';if(musicUrl)musicState='Đã tạm dừng nhạc'}fxEnabled=d.fx!==false;fxVolume=d.fxVolume==null?.45:Math.max(0,Math.min(1,Number(d.fxVolume)||0));sound=!!d.sound;volume=Math.max(0,Math.min(1,Number(d.volume)||0));voiceRate=Math.max(.7,Math.min(1.5,Number(d.rate)||1.1));guide.style.display=d.guide===false?'none':'';if(!sound&&'speechSynthesis'in window){queue=[];speechSynthesis.cancel();speaking=false;}}
try{const saved=JSON.parse(localStorage.getItem('ket-xe-settings')||'null');if(saved)settings(saved)}catch{}
remote.onmessage=({data:d})=>{if(!d||typeof d!=='object')return;if(!liveMode&&d.type==='test'&&Number.isInteger(d.action)&&d.action>=0&&d.action<gifts.length)trigger(d.action);if(d.type==='settings')settings(d);if(d.type==='mediaChanged'){if(d.key==='music'){++mediaGeneration;setTrack(d.file||null)}else loadMedia()}if(d.type==='musicPlay')playMusic();if(d.type==='fxTest')fx(d.kind==='slap'?'slap':'motor');if(d.type==='voiceTest'){sound=true;queue.push('A lô, nghe tui nói rõ không?');speak()}if(d.type==='reset'){scene=null;pending=[];queue=[];active=-1;speech.textContent='';if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;}if(d.type==='ping')remote.postMessage({type:'pong'});};
setInterval(()=>remote.postMessage({type:'status',busy:!!scene,queued:pending.length,vehicles:names.length-departed.size,departed:departed.size,voiceState,voiceCount:('speechSynthesis'in window?speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('vi')).length:0),audioState:audio?.state||'chưa bật',fxState,musicState,musicName,musicPlaying:!music.paused}),1000);
if(new URLSearchParams(location.search).has('live')){document.querySelector('#controls').style.display='none';}c.addEventListener('pointerdown',unlock);const audioButton=document.createElement('button');audioButton.textContent='Bật âm thanh / thử giọng';audioButton.style.cssText='position:fixed;top:8px;left:8px;z-index:10';document.body.append(audioButton);audioButton.onclick=()=>{unlock();playMusic();setTimeout(()=>fx('slap'),250);sound=true;if('speechSynthesis'in window){speechSynthesis.resume();queue.push('A lô, nghe tui nói rõ không?');speak();}audioButton.textContent='Thử tiếng bụp + thoại';setTimeout(()=>{if(voiceState==='Đã phát thoại'&&audio?.state==='running')audioButton.style.display='none'},3500)};
</script></html>
