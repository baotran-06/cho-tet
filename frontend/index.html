<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kẹt xe Việt Nam</title><style>*{box-sizing:border-box}body{margin:0;background:#182829;font:600 14px Arial;color:white;display:grid;place-items:center;min-height:100dvh}main{width:min(100vw,56.25dvh);aspect-ratio:9/16;position:relative;overflow:hidden;background:#a4c8d5}canvas{width:100%;height:100%;display:block}#guide{position:absolute;bottom:2%;left:2%;background:#142525bd;border-radius:8px;padding:5px 7px;font-size:clamp(8px,1.3vh,12px)}#guide div{display:flex;align-items:center;gap:5px;margin:2px}#guide img{width:18px;height:18px;object-fit:contain}#speech{position:absolute;bottom:20%;left:26%;right:3%;text-align:center;color:#fff;text-shadow:0 2px 3px #000;font-size:14px}#controls{position:fixed;top:6px;right:6px}button{background:#fff;color:#333;border:0;padding:7px;border-radius:6px;cursor:pointer}dialog{max-width:90vw;background:#fff;color:#222;border:0;border-radius:12px}dialog button{background:#eee;margin:4px}</style><main><canvas width="450" height="800" id="c"></canvas><div id="speech"></div><aside id="guide"></aside></main><div id="controls"><button onclick="panel.showModal()">Thử hiệu ứng</button></div><dialog id="panel"><p>Chế độ thử • chưa kết nối LIVE</p><div id="actions"></div><button onclick="sound=!sound;this.textContent=sound?'Tắt thoại':'Bật thoại'">Bật thoại</button><button onclick="panel.close()">Đóng</button></dialog><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),guide=document.querySelector('#guide'),actions=document.querySelector('#actions'),speech=document.querySelector('#speech');
const gifts=[['rose','Vượt đèn','Thôi tui đi trước nha!','Ủa đèn còn đỏ mà!','Xin đường chút coi!'],['finger_heart','Chọi dép','Ủa ai gửi dép vậy?','Trả dép cho tui coi!','Kẹt xe còn gặp chuyện!'],['doughnut','Đạp xe','Ủa mắc gì quậy tui?','Xe tui mới rửa đó!','Trời đất ơi!'],['tiktok','Chặn đường','Nhích giùm miếng coi!','Đường đâu mà đi!','Đứng đây tới tối quá!'],['bouquet','Cứu xe','Ân nhân của tui!','Cảm ơn nha, mai mời cà phê!','May quá trời!'],['bravo','Thông đường','Cuối cùng cũng về được!','Đi thôi bà con!','Mừng quá trời!']];
let sound=false,active=-1,until=0,mode=0,previous={},queue=[],speaking=false;const names=['@minh','@bong','@thao','@bin','@khanh','@linh','@nam','@meomeo','@bao','@han','@tuan','@mi'];names.push(...Array.from({length:132},(_,i)=>'@xe'+(i+13)));const colors=['#d95543','#f0b84a','#4e8a91','#e4e4d6','#4e6688','#9c657c'];
gifts.forEach((a,i)=>{let d=document.createElement('div'),im=document.createElement('img');im.src='assets/gifts/'+a[0]+'.webp';im.alt=a[0];d.append(im,document.createTextNode(a[1]));guide.append(d);let b=document.createElement('button');b.textContent=a[1];b.onclick=()=>{panel.close();trigger(i)};actions.append(b)});
function trigger(i){mode=i;active=Math.floor(Math.random()*144);until=performance.now()+2400;let options=gifts[i].slice(2).filter(x=>x!==previous[i]);let line=options[Math.floor(Math.random()*options.length)];previous[i]=line;speech.textContent=names[active]+': '+line;if(sound&&'speechSynthesis'in window){if(queue.length<4)queue.push(line);speak()}}
function speak(){if(speaking||!queue.length)return;speaking=true;let u=new SpeechSynthesisUtterance(queue.shift());u.lang='vi-VN';u.rate=1.1;u.onend=u.onerror=()=>{speaking=false;speak()};speechSynthesis.speak(u)}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function text(s,x,y,size,col='#fff'){g.font='bold '+size+'px Arial';g.textAlign='center';g.fillStyle=col;g.fillText(s,x,y)}
function shade(x,y,w,h,a,b){let z=g.createLinearGradient(x,y,x+w,y+h);z.addColorStop(0,a);z.addColorStop(1,b);return z}
function rider(x,y,s,i,t){g.save();g.translate(x,y);g.scale(s,s);if(i===active&&t<until){g.rotate(Math.sin(t/60)*.06);if(mode===0||mode===5)g.translate(0,Math.sin(t/140)*8);if(mode===1)text('✦',35,-60,28,'#ffd456');if(mode===4)text('♥',35,-70,25,'#f5d779')}
const paint=colors[i%6],shirt=['#53636a','#dedbd2','#4d5651','#8b7770','#344759','#a59b85'][i%6];
ellipse(0,58,32,8,'#22282b77');ellipse(0,37,10,24,'#22282a');ellipse(0,39,4,17,'#6d7374');
poly([[-25,-27],[-18,-42],[18,-42],[25,-27],[24,6],[-24,6]],shade(-25,-42,50,48,shirt,'#333e42'));
poly([[-21,-31],[-34,-9],[-29,-4],[-13,-22]],shirt);poly([[21,-31],[34,-9],[29,-4],[13,-22]],shirt);
ellipse(0,-52,13,18,'#b68a71');ellipse(0,-60,16,15,shade(-15,-72,30,30,'#b5bab9','#343c40'));rect(-15,-59,30,4,'#30383b');ellipse(-5,-52,1.5,1.5,'#303030');ellipse(5,-52,1.5,1.5,'#303030');if(i%3!==0)poly([[-12,-48],[12,-48],[9,-38],[-9,-38]],'#bbc7c6');
rect(-32,-12,64,4,'#242a2d');ellipse(-30,-9,5,4,'#b58a73');ellipse(30,-9,5,4,'#b58a73');
g.strokeStyle='#3c4548';g.lineWidth=2;g.beginPath();g.moveTo(-25,-11);g.lineTo(-36,-31);g.moveTo(25,-11);g.lineTo(36,-31);g.stroke();ellipse(-37,-32,8,4,'#252d30');ellipse(37,-32,8,4,'#252d30');
poly([[-24,-10],[-30,8],[-19,36],[-8,44],[8,44],[19,36],[30,8],[24,-10]],shade(-30,-10,60,50,paint,'#252d32'));poly([[-20,-5],[20,-5],[14,7],[-14,7]],shade(-20,-5,40,12,'#f9f8df','#9aa8aa'));poly([[-22,11],[-12,17],[-17,29]],'#b6bbbd');poly([[22,11],[12,17],[17,29]],'#b6bbbd');ellipse(0,26,8,17,shade(-8,9,16,35,paint,'#30393c'));rect(-8,33,16,3,'#b5b8b7');
if(s>.55||i===active){g.font='bold 10px Arial';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#20282c';g.strokeText(names[i],0,-79);g.fillStyle='#fff';g.fillText(names[i],0,-79);}g.restore()}
function frame(t){rect(0,0,450,800,'#afbdc0');ellipse(360,70,34,34,'#f8dc9a');poly([[0,800],[126,226],[324,226],[450,800]],'#606568');poly([[0,800],[0,235],[126,226]],'#b6aea0');poly([[450,800],[450,235],[324,226]],'#d2bc9a');for(let side=0;side<2;side++){for(let j=0;j<4;j++){let x=side?340+j*30:j*30-10,y=115+j*17;rect(x,y,35,180-j*8,['#dca37d','#e6c78f','#9bb6a8','#c3aeb0'][j]);for(let k=0;k<3;k++)rect(x+7,y+14+k*28,19,15,'#526d76');rect(x,y+95,35,17,'#5a7772')}}rect(8,210,105,24,'#aa4037');text('CƠM TẤM',60,227,14);rect(337,220,110,24,'#447b69');text('CÀ PHÊ',392,237,14);for(let k=0;k<7;k++)poly([[8+k*64,645],[42+k*64,645],[48+k*64,674],[3+k*64,674]],'#d9d9cf');rect(0,610,450,5,'#e3e1d5');rect(429,385,6,230,'#35474b');rect(410,350,36,80,'#29383d');['#f14e45','#5c543e','#354a40'].forEach((a,i)=>ellipse(428,364+i*26,10,10,a));text('KẸT XE',225,46,33,'#28464a');text('SÀI GÒN • GIỜ TAN TẦM',225,68,11,'#28464a');g.save();g.beginPath();g.moveTo(126,226);g.lineTo(324,226);g.lineTo(450,610);g.lineTo(0,610);g.closePath();g.clip();for(let i=0;i<144;i++){let row=Math.floor(i/12),j=i%12,p=row/11,y=237+320*Math.pow(p,1.38),s=.22+.72*p,half=99+(y-226)*126/574,x=225-half+(j+.5)*(half*2/12)+Math.sin(i*3.17)*3;rider(x,y+Math.sin(t/600+i)*.55,s,i,t)}g.restore();if(t>until&&speech.textContent)speech.textContent='';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
