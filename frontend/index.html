<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Văn phòng Tổng tài</title><link rel="stylesheet" href="css/office.css"></head>
<body>
<main id="frame" aria-label="Văn phòng Tổng tài">
  <div id="camera">
    <img class="office-background" src="assets/office/office.webp" alt="">
    <div id="wedding-set" aria-hidden="true"><div class="arch">✿<span>♥</span>✿</div><div class="aisle"></div></div>
    <div id="bedroom-set"><div class="door-panels"></div><span>Đêm tân hôn</span></div>
    <div class="actor ceo" id="ceo">
      <div class="nameplate"><strong id="ceo-name">Tổng tài</strong><span>Tổng tài</span></div>
      <img id="ceo-image" src="assets/office/ceo-seated.webp" alt="Tổng tài">
      <span class="talk-mouth"></span>
    </div>
    <div class="actor secretary" id="secretary">
      <div class="nameplate"><strong id="secretary-name">Thư ký</strong><span>Thư ký</span></div>
      <img id="secretary-image" src="assets/office/secretary.webp" alt="Thư ký">
      <span class="talk-mouth"></span>
    </div>
    <div class="actor lieu" id="lieu">
      <div class="nameplate"><strong id="lieu-name">Liễu Như Yên</strong><span>Liễu Như Yên</span></div>
      <img src="assets/office/lieu.webp" alt="Liễu Như Yên">
      <span class="talk-mouth"></span>
    </div>
    <div class="desk-front"></div>
    <div id="particles" aria-hidden="true"></div>
    <div id="impact" aria-hidden="true"></div>
    <div id="ring-exchange" aria-hidden="true">💍</div>
  </div>
  <header><span class="heading-line"></span><h1>VĂN PHÒNG TỔNG TÀI</h1><span class="heading-line"></span></header>
  <div id="gift-notice" role="status" hidden></div>
  <div id="subtitle" aria-live="polite" hidden><strong id="speaker"></strong><span id="spoken"></span></div>
  <section id="gift-board" aria-label="Quà và hiệu ứng"><div id="gifts"></div></section>
  <div class="controls"><span id="mode">Đang tải…</span><button id="audio-start">Bật âm thanh</button><a href="admin.html" target="_blank" rel="noopener">Điều khiển ↗</a><button id="fullscreen" aria-label="Toàn màn hình">⛶</button></div>
  <div id="error" role="alert" hidden></div>
</main>
<script type="module" src="js/office-game.js"></script>
</body></html>
