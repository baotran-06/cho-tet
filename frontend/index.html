<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kẹt xe Việt Nam</title><style>*{box-sizing:border-box}body{margin:0;background:#182829;font:600 14px Arial;color:white;display:grid;place-items:center;min-height:100dvh}main{width:min(100vw,56.25dvh);aspect-ratio:9/16;position:relative;overflow:hidden;background:#a4c8d5}canvas{width:100%;height:100%;display:block}#guide{position:absolute;bottom:2%;left:2%;background:#142525bd;border-radius:8px;padding:5px 7px;font-size:clamp(8px,1.3vh,12px)}#guide div{display:flex;align-items:center;gap:5px;margin:2px}#guide img{width:18px;height:18px;object-fit:contain}#speech{position:absolute;bottom:20%;left:26%;right:3%;text-align:center;color:#fff;text-shadow:0 2px 3px #000;font-size:14px}#controls{position:fixed;top:6px;right:6px}button{background:#fff;color:#333;border:0;padding:7px;border-radius:6px;cursor:pointer}dialog{max-width:90vw;background:#fff;color:#222;border:0;border-radius:12px}dialog button{background:#eee;margin:4px}</style><main><canvas width="450" height="800" id="c"></canvas><div id="speech"></div><aside id="guide"></aside></main><div id="controls"><button onclick="panel.showModal()">Thử hiệu ứng</button></div><dialog id="panel"><p>Chế độ thử • chưa kết nối LIVE</p><div id="actions"></div><button onclick="sound=!sound;this.textContent=sound?'Tắt thoại':'Bật thoại'">Bật thoại</button><button onclick="panel.close()">Đóng</button></dialog><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),guide=document.querySelector('#guide'),actions=document.querySelector('#actions'),speech=document.querySelector('#speech');
const gifts=[['rose','Vượt đèn','Thôi tui đi trước nha!','Ủa đèn còn đỏ mà!','Xin đường chút coi!'],['finger_heart','Chọi dép','Ủa ai gửi dép vậy?','Trả dép cho tui coi!','Kẹt xe còn gặp chuyện!'],['doughnut','Đạp xe','Ủa mắc gì quậy tui?','Xe tui mới rửa đó!','Trời đất ơi!'],['tiktok','Chặn đường','Nhích giùm miếng coi!','Đường đâu mà đi!','Đứng đây tới tối quá!'],['bouquet','Cứu xe','Ân nhân của tui!','Cảm ơn nha, mai mời cà phê!','May quá trời!'],['bravo','Thông đường','Cuối cùng cũng về được!','Đi thôi bà con!','Mừng quá trời!']];
let sound=false,active=-1,until=0,mode=0,previous={},queue=[],speaking=false;const names=['@minh','@bong','@thao','@bin','@khanh','@linh','@nam','@meomeo','@bao','@han','@tuan','@mi'];const colors=['#d95543','#f0b84a','#4e8a91','#e4e4d6','#4e6688','#9c657c'];
gifts.forEach((a,i)=>{let d=document.createElement('div'),im=document.createElement('img');im.src='assets/gifts/'+a[0]+'.webp';im.alt=a[0];d.append(im,document.createTextNode(a[1]));guide.append(d);let b=document.createElement('button');b.textContent=a[1];b.onclick=()=>{panel.close();trigger(i)};actions.append(b)});
function trigger(i){mode=i;active=Math.floor(Math.random()*12);until=performance.now()+2400;let options=gifts[i].slice(2).filter(x=>x!==previous[i]);let line=options[Math.floor(Math.random()*options.length)];previous[i]=line;speech.textContent=names[active]+': '+line;if(sound&&'speechSynthesis'in window){if(queue.length<4)queue.push(line);speak()}}
function speak(){if(speaking||!queue.length)return;speaking=true;let u=new SpeechSynthesisUtterance(queue.shift());u.lang='vi-VN';u.rate=1.1;u.onend=u.onerror=()=>{speaking=false;speak()};speechSynthesis.speak(u)}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function text(s,x,y,size,col='#fff'){g.font='bold '+size+'px Arial';g.textAlign='center';g.fillStyle=col;g.fillText(s,x,y)}
function rider(x,y,s,i,t){g.save();g.translate(x,y);g.scale(s,s);if(i===active&&t<until){g.rotate(Math.sin(t/60)*.08);if(mode===0||mode===5)g.translate(0,Math.sin(t/140)*12);if(mode===1)text('✦',35,-60,28,'#ffd456');if(mode===4)text('♥',35,-70,25,'#f5d779')}ellipse(0,55,31,9,'#30363b55');rect(-8,25,16,33,'#252d32');ellipse(0,10,27,37,colors[i%6]);ellipse(0,5,18,13,'#e7eee9');rect(-26,-15,52,5,'#30373a');ellipse(-25,-15,6,5,'#e7b18c');ellipse(25,-15,6,5,'#e7b18c');ellipse(0,-28,21,23,colors[(i+2)%6]);ellipse(0,-50,17,19,'#edb88e');ellipse(0,-58,19,15,colors[i%6]);rect(-18,-56,36,5,'#26383f');ellipse(-6,-48,2,2,'#292929');ellipse(6,-48,2,2,'#292929');ellipse(0,-41,4,2,'#9b5648');rect(-38,-87,76,16,'#26383edc');text(names[i],0,-75,11);g.restore()}
function frame(t){rect(0,0,450,800,'#a7cdd6');ellipse(360,70,34,34,'#f8dc9a');poly([[0,800],[126,226],[324,226],[450,800]],'#666e72');poly([[0,800],[0,235],[126,226]],'#d2bc9a');poly([[450,800],[450,235],[324,226]],'#d2bc9a');for(let side=0;side<2;side++){for(let j=0;j<4;j++){let x=side?340+j*30:j*30-10,y=115+j*17;rect(x,y,35,180-j*8,['#dca37d','#e6c78f','#9bb6a8','#c3aeb0'][j]);for(let k=0;k<3;k++)rect(x+7,y+14+k*28,19,15,'#526d76');rect(x,y+95,35,17,'#5a7772')}}rect(8,210,105,24,'#aa4037');text('CƠM TẤM',60,227,14);rect(337,220,110,24,'#447b69');text('CÀ PHÊ',392,237,14);for(let k=0;k<6;k++)poly([[35+k*68,650],[70+k*68,650],[80+k*68,680],[28+k*68,680]],'#e5e4db');rect(365,110,7,175,'#35474b');rect(349,95,38,86,'#29383d');['#f14e45','#7d7045','#405e4c'].forEach((a,i)=>ellipse(368,110+i*27,10,10,a));text('KẸT XE',225,46,33,'#28464a');text('SÀI GÒN • GIỜ TAN TẦM',225,68,11,'#28464a');for(let i=0;i<12;i++){let row=Math.floor(i/4),j=i%4,s=.65+row*.31,x=225+(j-1.5)*(65+row*25),y=300+row*124+Math.sin(t/500+i)*1.7;rider(x,y,s,i,t)}if(t>until&&speech.textContent)speech.textContent='';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
